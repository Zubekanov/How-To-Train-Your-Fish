<text x="245" y="634" font-size="28" font-weight="600" fill="#7949b7" text-anchor="start" >entity network</text>
<text x="175" y="666" font-size="22" font-weight="400" fill="#52627b" text-anchor="start" >fresh start, nothing kept from v1</text>
