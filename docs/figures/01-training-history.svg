<text x="175" y="147" font-size="58" font-weight="700" fill="white" text-anchor="start" >01 · TRAINING HISTORY</text>
<text x="175" y="206" font-size="32" font-weight="400" fill="#dce6f4" text-anchor="start" >Three lineages, one warm start. The final agent is v3, which ran until the cloud credit ran out</text>
