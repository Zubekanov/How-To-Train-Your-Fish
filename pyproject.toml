[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fishrl"
version = "0.1.0"
description = "Adversarial self-play ML environment for Forgetful Fish (Dandân)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pettingzoo>=1.24",
    "gymnasium>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["fishrl*"]

[tool.setuptools.package-data]
"fishrl" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["fishrl/tests"]
